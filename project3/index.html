<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易经日历</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>易经日历</h1>
            <div class="current-time" id="currentTime"></div>
        </header>
        
        <main>
            <div class="grid-container">
                <section class="card date-card">
                    <h2>日期</h2>
                    <div class="date-info">
                        <div class="solar-date" id="solarDate"></div>
                        <div class="lunar-date" id="lunarDate"></div>
                    </div>
                    <div class="weekday-info" id="weekdayInfo"></div>
                </section>
                
                <section class="card bagua-card">
                    <h2>易经八卦</h2>
                    <div class="bagua-display">
                        <div class="bagua-symbol" id="baguaSymbol"></div>
                        <div class="bagua-info" id="baguaInfo"></div>
                        <button class="btn" onclick="generateBagua()">今日卜卦</button>
                    </div>
                </section>
                
                <section class="card astrology-card">
                    <h2>星象问卜</h2>
                    <div class="astrology-display">
                        <div class="astrology-result" id="astrologyResult"></div>
                        <button class="btn" onclick="getAstrology()">今日运势</button>
                    </div>
                </section>
                
                <section class="card notes-card">
                    <h2>记事簿</h2>
                    <div class="notes-container">
                        <textarea id="notesArea" placeholder="在此记录今天的事情..."></textarea>
                        <button class="btn" onclick="saveNotes()">保存</button>
                    </div>
                </section>
                
                <section class="card reminders-card">
                    <h2>重要事件提醒</h2>
                    <div class="reminders-container">
                        <div class="add-reminder">
                            <input type="text" id="reminderText" placeholder="事件内容">
                            <input type="datetime-local" id="reminderTime">
                            <button class="btn" onclick="addReminder()">添加</button>
                        </div>
                        <div class="reminders-list" id="remindersList"></div>
                    </div>
                </section>
            </div>
        </main>
        
        <footer>
            <p>易经日历 - 传统与现代的结合</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
